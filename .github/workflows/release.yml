name: desktop-build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ai-gateway-windows-amd64
            backend: ai-gateway-backend.exe
            app: build/bin/api-ai-gateway.exe
          - os: ubuntu-24.04
            artifact: ai-gateway-linux-amd64
            backend: ai-gateway-backend
            app: build/bin/api-ai-gateway
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          enable-cache: true
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Verify backend
        working-directory: backend
        run: uv sync --locked --all-groups && uv run pytest -q && uv run ruff check . && uv run mypy src
      - name: Build native backend sidecar
        working-directory: backend
        run: uv run pyinstaller ai-gateway-backend.spec --clean --noconfirm
      - name: Smoke test Windows backend sidecar
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:AI_GATEWAY_PORT = '18080'
          $env:AI_GATEWAY_DATABASE_PATH = Join-Path $env:RUNNER_TEMP 'gateway.db'
          $env:AI_GATEWAY_CREDENTIAL_FILE = Join-Path $env:RUNNER_TEMP 'secrets.enc'
          $env:AI_GATEWAY_CODEX_WORKSPACE = Join-Path $env:RUNNER_TEMP 'codex-runs'
          $env:AI_GATEWAY_MASTER_KEY = uv run --project backend python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
          $process = Start-Process -FilePath 'backend/dist/ai-gateway-backend.exe' -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            foreach ($attempt in 1..40) {
              try {
                $response = Invoke-RestMethod -Uri 'http://127.0.0.1:18080/api/health' -TimeoutSec 1
                if ($response.status -eq 'ok') { $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 250 }
            }
            if (-not $ready) { throw 'Packaged backend did not become healthy.' }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Smoke test Linux backend sidecar
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export AI_GATEWAY_PORT=18080
          export AI_GATEWAY_DATABASE_PATH="$RUNNER_TEMP/gateway.db"
          export AI_GATEWAY_CREDENTIAL_FILE="$RUNNER_TEMP/secrets.enc"
          export AI_GATEWAY_CODEX_WORKSPACE="$RUNNER_TEMP/codex-runs"
          export AI_GATEWAY_MASTER_KEY="$(uv run --project backend python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          backend/dist/ai-gateway-backend &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:18080/api/health | grep --quiet '"status":"ok"'; then
              exit 0
            fi
            sleep 0.25
          done
          echo 'Packaged backend did not become healthy.' >&2
          exit 1
      - name: Inject Windows backend sidecar
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item -LiteralPath 'backend/dist/ai-gateway-backend.exe' -Destination 'internal/backendbinary/binaries/ai-gateway-backend.exe' -Force
      - name: Inject Linux backend sidecar
        if: runner.os == 'Linux'
        run: cp backend/dist/ai-gateway-backend internal/backendbinary/binaries/ai-gateway-backend
      - name: Verify internal desktop UI
        working-directory: ui
        run: npm ci && npm test && npm run build
      - name: Verify Go lifecycle
        run: go test ./internal/...
      - name: Build Windows desktop app
        if: runner.os == 'Windows'
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.15.0 build -clean -platform windows/amd64
      - name: Build Linux desktop app
        if: runner.os == 'Linux'
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.15.0 build -clean -platform linux/amd64 -tags webkit2_41
      - name: Build Linux Debian package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package_root="$RUNNER_TEMP/ai-gateway-package"
          install -Dm755 build/bin/api-ai-gateway "$package_root/usr/bin/api-ai-gateway"
          install -Dm644 packaging/linux/ai-gateway.desktop "$package_root/usr/share/applications/ai-gateway.desktop"
          install -Dm644 packaging/linux/control "$package_root/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$package_root" build/bin/ai-gateway_0.1.0_amd64.deb
      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.app }}
            build/bin/*.deb
          if-no-files-found: error
