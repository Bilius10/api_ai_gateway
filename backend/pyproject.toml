[project]
name = "ai-gateway"
version = "0.1.0"
description = "Stateless multi-provider AI gateway"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=46.0.0",
  "fastapi>=0.118.0",
  "httpx>=0.28.1",
  "pydantic-settings>=2.11.0",
  "uvicorn[standard]>=0.37.0",
]

[dependency-groups]
dev = [
  "mypy>=1.18.2",
  "pyinstaller>=6.16.0",
  "pytest>=8.4.2",
  "pytest-asyncio>=1.2.0",
  "ruff>=0.13.2",
]

[project.scripts]
ai-gateway-backend = "ai_gateway.sidecar:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_gateway"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "SIM117"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ai_gateway"]
